name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        extras: ["", "[mcp,anneal,api]"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".${{ matrix.extras }}" pytest
      - name: Test (against a throwaway data dir)
        run: |
          export GUTCHECK_DATA_DIR="$(mktemp -d)"
          python -m pytest -q
