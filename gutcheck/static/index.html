document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModal(); closeReport(); closeCareer(); closeSettings(); } });

// Cross-device sync: the laptop server is the single source of truth, but the client
// only pulls state on demand. Re-pull when this tab becomes visible/focused so picking
// up another device — or returning to an idle tab — snaps to the CURRENT shared game.
// Guards (read-only throughout): SYNCING dedups the visibilitychange+focus double-fire;
// skip while a modal is open or the raise sizing has focus (don't yank what the user is
// looking at / editing); the ACTGEN epoch discards the render if ANY action started
// during the GET — catches the action that started AND finished mid-fetch (BUSY alone
// can't, since it's false again by then).
async function syncState(){
  if(BUSY || SYNCING) return;
  if(REVIEW_HAND!=null) return;                 // don't yank the table during a hand review
  if(DRILL_DP) return;                          // …or out from under an OPEN drill (the live commit-beat runs
                                                // outside BUSY, so a visibility/focus re-pull would desync the felt under it)
  if(document.querySelector(".modal-bg.open")) return;
  const ae = document.activeElement;
  if(ae && ae.closest && ae.closest(".sizing")) return;
  SYNCING = true;
  const gen = ACTGEN;
  try{
    const v = await api("/api/state");
    if(!BUSY && ACTGEN === gen) render(v);
  } catch(e){ /* offline / transient — keep the current view */ }
  finally{ SYNCING = false; }
}
// re-prime settings alongside the state re-pull: a failed boot fetch, or coaching toggled from
// another surface (the MCP, a second device), self-heals the live "talk it through"/"show the facts"
// label on the next return-to-tab — no separate cadence (these events already fire for cross-device sync).
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ loadSettings(); syncState(); } });
window.addEventListener("focus", ()=>{ loadSettings(); syncState(); });

// ---- coach channel (Slice 1): in-hand "Ask flow" + post-hand "Review with flow" ----
// COACH_GEN is the staleness epoch: bumped on every ask AND every hero action, so an
// in-flight poll whose spot the player already moved past resolves into nothing.
let COACH_GEN = 0, REVIEW_HAND = null, REVIEW_SHOWN = false, REVIEW_PENDING = false, REVIEW_SID = null;

// fire-and-forget a committed read into the calibration trend. NEVER throws into the drill flow:
// the reveal already happened from the canonical number the server sent, so a logging hiccup must
// not break the UX — a dropped sample is strictly better than a broken drill.
function postCalibration(path, body){
  try{ api(path, body).catch(()=>{}); }catch(e){}
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatCoach(text){ return escapeHtml(text).replace(/\n/g,"<br>"); }

function renderCoach(bodyHtml){
  const el=document.getElementById("coachpanel"); el.style.display="block";
  const reviewing = REVIEW_HAND!=null;
  const lbl = reviewing ? `♠ coach · reviewing hand #${REVIEW_HAND}` : "♠ coach";
  const actions = reviewing
    ? `<button class="quick" onclick="backToReport()">↩ Back to report</button>`
    : `<button class="coachx" onclick="hideCoach()">✕</button>`;
  el.innerHTML=`<div class="coachhdr"><span class="coachlbl">${lbl}</span>${actions}</div>`+
               `<div class="coachbody">${bodyHtml}</div>`;
}
function thinkingCoach(msg){ renderCoach(`<span class="thinking">${escapeHtml(msg)}</span>`); }
function answeredCoach(text){ renderCoach(formatCoach(text)); }
// bump the epoch on EVERY dismissal so a detached in-flight pollCoach self-cancels
// instead of re-opening the panel the user just closed (covers backToReport/restoreView,
// which both route through here).
function hideCoach(){ COACH_GEN++; abortDrill(); const el=document.getElementById("coachpanel"); el.style.display="none"; el.innerHTML=""; }

async function pollCoach(id, gen, tries=0){
  if(gen!==COACH_GEN) return;                    // superseded by a newer ask / a hero action
  let r=null; try{ r=await api("/api/coach/poll?id="+id); }catch(e){}
  if(gen!==COACH_GEN) return;
  if(r && r.status==="answered"){ answeredCoach(r.response); return; }
  if(r && r.status==="missing"){ answeredCoach("⚠ that coaching request expired."); return; }
  // the full-flow coach (claude -p) is DEEP: ~30s typical, up to the daemon's 90s ceiling (then it
  // falls back to facts). Poll PAST that ceiling (+margin) before declaring failure — the old 60s
  // budget quit while the daemon was still working — and reassure once it runs long so a real read
  // doesn't read as a hang.
  if(tries>85){ answeredCoach("⚠ no coach answered in ~100s — check the server log: is it running without <code>--no-coach</code>, and is <code>claude</code> logged in on this machine?"); return; }
  if(tries===18){ const el=document.querySelector("#coachpanel .thinking"); if(el) el.textContent="the coach is going deep — a full read can take 30–60s…"; }
  setTimeout(()=>pollCoach(id, gen, tries+1), 1200);
}

// "Log read ♠": LOG a read — pure calibration, NO coach dispatch (logging a read ≠ asking flow for
// coaching: "most times I log a read I'm not looking for coaching"). Fetch the spot, run the gut-commit
// drill, compute the gap in CODE at commit (no worker needed). Coaching is a deliberate FOLLOW-ON — a
// "talk it through ♠" button appears ON the reveal (talkItThrough), only when you actually want the why.
async function logRead(){
  if(BUSY) return;
  REVIEW_HAND=null; COACH_GEN++; const gen=COACH_GEN;
  let r=null;
  try{ r=await api("/api/read/spot"); }                       // GET — reads the spot, dispatches NO coach
  catch(e){ if(gen===COACH_GEN) answeredCoach("⚠ couldn't read the spot — is the server up?"); return; }
  if(gen!==COACH_GEN) return;
  if(!r || r.error){ if(gen===COACH_GEN) answeredCoach("⚠ "+escapeHtml((r&&r.error)||"no live decision to read")); return; }
  LIVE_TOKEN = r.token || null;   // round-tripped on commit so a read off a stale drill (the hand moved) is rejected
  if(r.spot && r.spot.has_model){ renderLiveDrill(r.spot, gen); return; }
  renderNoModel(gen);   // no live opponent to model against (rare) — nothing to calibrate; offer the prose
}

// no-model spot: there's no read to calibrate, so don't silently no-op — say so and OFFER coaching
// (never force it). The {live:true} marker lets a hero action tear this down like a live drill.
function renderNoModel(gen){
  abortDrill();
  DRILL_DP={live:true};
  LIVE_EQ=null;                                      // no number → talk-it-through narrates without one
  const el=document.getElementById("drillpanel"); el.style.display="block";
  el.innerHTML=`
    <div class="drill-hd"><span class="lbl">♠ read check · live</span>
      <span class="step">no opponent to read</span></div>
    <div class="drill-reveal show mid">
      <div class="big">No live opponent to read against here — nothing to calibrate.</div>
      <button class="ask-flow" id="talk-btn" onclick="talkItThrough()">talk it through ♠</button>
      <button class="drill-next" onclick="dismissLiveDrill()">Got it ▸</button></div>`;
}

async function reviewHand(sid, handNo){
  if(BUSY) return; BUSY=true;
  COACH_GEN++; const gen=COACH_GEN; REVIEW_PENDING=true;   // pending until commit — so closeReport can supersede the in-flight ask
  try{
    // ask FIRST, with the report still open — only commit to the review UI once it
    // succeeds, so an error leaves the player on the report they were reading (not a
    // blank table with the modal gone and no way back).
    let r=null;
    try{ r=await api("/api/coach/ask",{kind:"review",session_id:sid,hand_no:handNo}); }
    catch(e){ alertReport("⚠ coach unreachable — is the server up?"); return; }
    if(r.error){ alertReport("⚠ "+escapeHtml(r.error)); return; }
    if(gen!==COACH_GEN) return;                       // superseded while awaiting (incl. closeReport mid-ask)
    REVIEW_HAND=handNo; REVIEW_SID=sid; REVIEW_PENDING=false;  // committed → REVIEW_SHOWN/restoreView owns back-out from here
    document.getElementById("report").classList.remove("open");
    thinkingCoach(`the coach is reviewing hand #${handNo}…`);
    pollCoach(r.id, gen);
    window._prevBoardLen=0;
    REVIEW_SHOWN=true;                  // a replay frame is now on the felt → close⇒restoreView
    await playFrames(r.frames||[], gen, handNo, r.decision_points||[]);  // aborts if user backs out mid-replay
  } finally { BUSY=false; REVIEW_PENDING=false; }
}

function backToReport(){ REVIEW_HAND=null; hideCoach(); if(LAST_REPORT) showReport(LAST_REPORT); }

// ---- the prediction-error drill (Slice 3): commit your gut, then see the EXACT equity ----
// The replay freezes at each hero postflop decision; the player estimates their equity by feel, commits,
// then the exact number (enumerated vs the villains' actual cards) reveals the gap. Felt-sense forge.
let DRILL_RESOLVE = null, DRILL_DP = null, DRILL_LEAN = null, LIVE_EQ = null, LIVE_TOKEN = null;
function cardsHtml(arr){
  return (arr||[]).map(c=>{
    const r=c[0]==="T"?"10":c[0], red=RED[c[1]]?" red":"";
    return `<div class="card lg${red}"><span class="r">${r}</span><span>${SUIT[c[1]]}</span></div>`;
  }).join("") || `<span style="color:var(--dim);font-size:12px">preflop</span>`;
}
// felt-sense label for an equity % — the gut reads bands, the % calibrates. MUST stay in sync with
// equity.py band()/_EQUITY_BANDS.
function eqBand(pct){
  if(pct==null) return "";
  for(const [hi,label] of [[2,"drawing dead"],[18,"drawing thin"],[42,"behind"],[58,"a coin flip"],[75,"a favorite"],[90,"a clear favorite"]])
    if(pct<hi) return label;
  return "crushing";
}
// SHARED felt-language judgment — the review drill (exact) and the live drill (modeled) MUST grade a
// read the same way, so this single function owns the band-gap → verdict mapping. Same-band isn't
// automatically "dialed": a wide band (e.g. coin flip 42-58) can hide a big miss, and praising a
// 20-point miss teaches a sloppy read (codex L3) — so "dialed" is gated on band AND calibration.
function readVerdict(gut, truth, truthBand){
  const gap=Math.round(gut-truth), gutBand=eqBand(gut), ag=Math.abs(gap);
  let cls, verdict;
  if(truthBand===gutBand){
    if(ag<=10){ cls="good"; verdict=`Dialed in — you read it <b>${truthBand}</b>, and it was.`; }
    else { cls="mid"; verdict=`Right read — <b>${truthBand}</b> — but your number was ${ag} off (${gut}% vs ${truth}%).`; }
  }
  else if(gap>0){ cls="warn"; verdict=`You read <b>${gutBand}</b> — it was actually <b>${truthBand}</b>.`; }
  else { cls="mid"; verdict=`You sold it short — you read <b>${gutBand}</b>, it was <b>${truthBand}</b>.`; }
  return {cls, verdict, gutBand, gap, ag};
}
function lockDrillInputs(){            // post-commit: freeze the slider/lean/note/commit so the read can't be edited
  document.getElementById("drill-eq").disabled=true;
  document.querySelectorAll("#drill-lean button").forEach(b=>b.disabled=true);
  const nt=document.getElementById("drill-note"); if(nt) nt.disabled=true;
  const tg=document.getElementById("drill-note-toggle"); if(tg) tg.disabled=true;
  const cb=document.querySelector(".drill-commit"); if(cb) cb.disabled=true;
}
function showLiveNote(){               // live beat's collapsed read-note: reveal + focus the box, retire the toggle
  const t=document.getElementById("drill-note-toggle"), n=document.getElementById("drill-note");
  if(t) t.style.display="none";
  if(n){ n.style.display="block"; n.focus(); }
}
function drillPct(v){ document.getElementById("drill-pct").textContent = `${v}% · ${eqBand(+v)}`; }
function runDrill(dp, dn, total){      // resolves when the player commits + advances (or the review aborts)
  return new Promise(resolve=>{ DRILL_RESOLVE=resolve; renderDrill(dp, dn, total); });
}
function abortDrill(){                 // back-out / supersede: tear down + release any awaiting playFrames
  const el=document.getElementById("drillpanel"); if(el){ el.style.display="none"; el.innerHTML=""; }
  DRILL_DP=null; DRILL_LEAN=null;
  if(DRILL_RESOLVE){ const r=DRILL_RESOLVE; DRILL_RESOLVE=null; r(); }
}
function renderDrill(dp, dn, total){
  DRILL_DP=dp; DRILL_LEAN=null;
  const facing = dp.to_call>0;
  const lean = facing ? (dp.can_raise ? ["fold","call","raise"] : ["fold","call"]) : ["check","bet"];
  const ctc = dp.cards_to_come;
  const ctcTxt = ctc===0?"showdown — no cards to come":ctc===1?"1 card to come":ctc+" cards to come";
  const el=document.getElementById("drillpanel"); el.style.display="block";
  el.innerHTML=`
    <div class="drill-hd"><span class="lbl">♠ read check</span>
      <span class="step">decision ${dn} of ${total} · ${escapeHtml(dp.street)}</span></div>
    <div class="drill-spot">
      <div class="grp"><span class="cap">board</span><div class="drill-cards">${cardsHtml(dp.board)}</div></div>
      <div class="grp"><span class="cap">your hand</span><div class="drill-cards">${cardsHtml(dp.hero_hole)}</div></div>
      <div class="grp"><span class="cap">${facing?`pot ${dp.pot} · to call ${dp.to_call}`:`pot ${dp.pot} · checked to you`}</span>
        <span style="color:var(--dim);font-size:11px">${ctcTxt} · vs ${dp.vs} live</span></div>
    </div>
    <div class="drill-q">Where's your gut? Drag until the read feels right — it'll name it.</div>
    <div class="drill-slider">
      <input type="range" min="0" max="100" value="50" id="drill-eq" oninput="drillPct(this.value)">
      <span class="drill-pct" id="drill-pct">50% · a coin flip</span>
    </div>
    <div class="drill-lean" id="drill-lean">
      ${lean.map(l=>`<button onclick="pickLean(this,'${l}')">${l[0].toUpperCase()+l.slice(1)}</button>`).join("")}
    </div>
    <textarea class="drill-note" id="drill-note" maxlength="280" rows="2"
      placeholder="read notes (optional) — your read in your own words, e.g. “weak kicker, drawing thin, all hands still to be made”"></textarea>
    <button class="drill-commit" onclick="commitRead()">Commit your read ▸</button>
    <div class="drill-reveal" id="drill-reveal"></div>`;
}
function pickLean(btn,l){ DRILL_LEAN=l; [...btn.parentNode.children].forEach(b=>b.classList.toggle("on",b===btn)); }
function commitRead(){
  const dp=DRILL_DP; if(!dp || dp.live) return;   // review commit; never act on a live-drill marker (it has no .equity)
  const gut=parseInt(document.getElementById("drill-eq").value);
  const exact=dp.equity, exactBand=dp.band||eqBand(exact);
  const {cls, verdict, gutBand} = readVerdict(gut, exact, exactBand);   // shared felt-language judgment
  const lean = DRILL_LEAN?` · your lean: <b style="color:#cfe6d8;font-size:13px;display:inline">${DRILL_LEAN}</b>`:"";
  const rev=document.getElementById("drill-reveal");
  rev.className="drill-reveal show "+cls;
  rev.innerHTML=`
    <div class="big">${verdict}</div>
    <div class="row">
      <span>the truth<b style="color:var(--gold)">${exactBand}</b><span class="eqpct">${exact}%</span></span>
      <span>your read<b style="color:#eaf2ec">${gutBand}</b><span class="eqpct">${gut}%</span></span></div>
    <div class="did">you actually ${escapeHtml(dp.action)}${lean}${dp.exact?" · exact, every runout enumerated":""}</div>
    <button class="drill-next" onclick="nextDrill()">Continue ▸</button>`;
  lockDrillInputs();
  // log this read into the calibration trend (exact source). The server recomputes the canonical
  // truth from (session_id, hand_no, n) — we send only the gut + lean + which decision.
  if(REVIEW_SID!=null && REVIEW_HAND!=null && dp.n!=null){
    const noteEl=document.getElementById("drill-note");
    const note=noteEl ? noteEl.value.trim() : "";   // optional prose read; server sanitizes + bounds it
    postCalibration("/api/calibration/review",
      {session_id:REVIEW_SID, hand_no:REVIEW_HAND, n:dp.n, gut, lean:DRILL_LEAN,
       note: note || null});
  }
}
function nextDrill(){
  const el=document.getElementById("drillpanel"); el.style.display="none"; el.innerHTML="";
  DRILL_DP=null; DRILL_LEAN=null;
  if(DRILL_RESOLVE){ const r=DRILL_RESOLVE; DRILL_RESOLVE=null; r(); }
}

// ---- the LIVE commit-beat (Slice 3 live path): the in-hand analog of the review drill ----
// "Log read" → commit your gut + lean (+ optional note) BEFORE anything reveals → the server computes
// the MODELED equity in CODE at commit (vs the observed-read range, NOT the cards) and reveals the gap.
// The number is computed only at commit (/api/read/commit), so it never leaks before the read is locked
// in. It's a read, not the cards — the reveal says so (modeled ≠ the exact truth the review drill
// enumerates). Coaching is NOT auto-fired here: the reveal offers a "talk it through ♠" follow-on.
function renderLiveDrill(spot, gen){
  document.getElementById("coachpanel").style.display="none";   // prose waits until after commit (it cites the number)
  abortDrill();                                                 // clear any prior drill state before reusing the panel
  DRILL_DP={live:true}; DRILL_LEAN=null;                        // marker so abortDrill/hideCoach tear this down on supersede
  const facing = spot.to_call>0;
  const lean = facing ? (spot.legal && spot.legal.can_raise ? ["fold","call","raise"] : ["fold","call"]) : ["check","bet"];
  const ctc = spot.cards_to_come;
  const ctcTxt = ctc>=5?"preflop":ctc===0?"showdown — no cards to come":ctc===1?"1 card to come":ctc+" cards to come";
  const priceTxt = facing?`pot ${spot.pot} · to call ${spot.to_call}`:`pot ${spot.pot} · checked to you`;
  const el=document.getElementById("drillpanel"); el.style.display="block";
  el.innerHTML=`
    <div class="drill-hd"><span class="lbl">♠ read check · live</span>
      <span class="step">${escapeHtml(spot.street||"")} · your decision</span></div>
    <div class="drill-spot">
      <div class="grp"><span class="cap">board</span><div class="drill-cards">${cardsHtml(spot.board)}</div></div>
      <div class="grp"><span class="cap">your hand</span><div class="drill-cards">${cardsHtml(spot.hero_hole)}</div></div>
      <div class="grp"><span class="cap">${priceTxt}</span>
        <span style="color:var(--dim);font-size:11px">${ctcTxt} · vs ${spot.live_count} live</span></div>
    </div>
    <div class="drill-q">Where's your gut? Drag until the read feels right — it'll name it.</div>
    <div class="drill-slider">
      <input type="range" min="0" max="100" value="50" id="drill-eq" oninput="drillPct(this.value)">
      <span class="drill-pct" id="drill-pct">50% · a coin flip</span>
    </div>
    <div class="drill-lean" id="drill-lean">
      ${lean.map(l=>`<button onclick="pickLean(this,'${l}')">${l[0].toUpperCase()+l.slice(1)}</button>`).join("")}
    </div>
    <div id="drill-note-row" style="margin-bottom:13px">
      <button type="button" class="drill-note-toggle" id="drill-note-toggle" onclick="showLiveNote()">+ read note</button>
      <textarea class="drill-note" id="drill-note" maxlength="280" rows="2" style="display:none"
        placeholder="your read in your own words (optional) — accessible to the coach when you ask"></textarea>
    </div>
    <button class="drill-commit" onclick="commitLogRead(${gen})">Commit your read ▸</button>
    <div class="drill-reveal" id="drill-reveal"></div>`;
}
async function commitLogRead(gen){
  if(gen!==COACH_GEN || !(DRILL_DP && DRILL_DP.live)) return;   // acted / re-opened / torn down / a review drill — stale
  const gut=parseInt(document.getElementById("drill-eq").value);
  const noteEl=document.getElementById("drill-note");          // optional prose read — captured at the live beat
  const note=noteEl ? noteEl.value.trim() : "";                // (the truest read: in-the-moment, pre-rationalization)
  lockDrillInputs();
  const cb=document.querySelector(".drill-commit"); if(cb) cb.textContent="reading the board…";
  // compute + log in ONE call: the server recomputes the modeled equity in CODE from authoritative game
  // state (anti-fab — never trusts a browser number) and records the calibration, then hands the number
  // back for the reveal. NO coach worker required — logging a read is pure calibration.
  let res=null; try{ res=await api("/api/read/commit",{gut, lean:DRILL_LEAN, note: note || null, token: LIVE_TOKEN}); }catch(e){}
  if(gen!==COACH_GEN) return;                        // superseded while waiting (a hero action) — drill torn down
  if(res && res.ok){ renderLiveReveal(gut, res.equity); return; }   // the gap + the talk-it-through follow-on
  // nothing logged: the spot moved on (the hand advanced elsewhere) or the read couldn't be computed.
  renderLiveReveal(gut, null, (res && res.reason==="spot moved")
    ? "This spot moved on — the hand advanced. Nothing was logged."
    : "Couldn't log this read.");
}

// "talk it through ♠": the DELIBERATE coaching follow-on, fired from the reveal — NEVER auto. Dispatches
// the coach for prose; passing the already-revealed equity (LIVE_EQ) makes the narration cite the SAME
// number the reveal showed (else the worker's own MC would wiggle ±1-2% off it). LIVE_EQ is null on a
// no-number spot — flow can still talk it through without a number.
async function talkItThrough(){
  const gen=COACH_GEN;                               // same epoch — a hero action still cancels the in-flight ask
  const btn=document.getElementById("talk-btn"); if(btn) btn.disabled=true;   // one ask per reveal
  thinkingCoach(factsOnly()?"pulling the facts…":"the coach is talking it through…");
  const body={kind:"decision"};
  // round-trip the spot token WITH the echoed equity so the server can reject a stale splice (the hand
  // advanced on another device between the reveal and this ask) instead of narrating the new spot with
  // the old number. A server "spot moved" error surfaces via the r.error branch below.
  if(LIVE_EQ && LIVE_EQ.hero_pct!=null){ body.equity=LIVE_EQ; body.token=LIVE_TOKEN; }
  let r=null;
  // re-enable the button on a transient failure so the operator can retry (a server-side rejection below
  // is definitive — leave it disabled there).
  try{ r=await api("/api/coach/ask", body); }
  catch(e){ if(gen===COACH_GEN){ answeredCoach("⚠ coach unreachable."); if(btn) btn.disabled=false; } return; }
  if(gen!==COACH_GEN) return;                         // superseded while awaiting (a hero action)
  if(r.error){ answeredCoach("⚠ "+escapeHtml(r.error)); return; }
  pollCoach(r.id, gen);
}
function renderLiveReveal(gut, eq, msg){
  LIVE_EQ = eq;                                      // stash for the optional "talk it through" follow-on
  const rev=document.getElementById("drill-reveal");
  // the coaching follow-on — deliberate, never auto-fired (logging a read ≠ asking for coaching). Offered
  // on every reveal that LOGGED (flow narrates the gap); LIVE_EQ makes the prose cite the SAME number.
  // honest label: with coaching OFF the follow-on returns the facts floor, not AI prose — so don't
  // promise "talk it through". (factsOnly() is false for an external worker, which may still coach.)
  const talk=`<button class="ask-flow" id="talk-btn" onclick="talkItThrough()">${factsOnly()?"show the facts ♠":"talk it through ♠"}</button>`;
  if(!eq || eq.hero_pct==null){                      // nothing logged (the spot moved / couldn't compute) — no
    rev.className="drill-reveal show mid";           // talk-it-through: the spot the read was made on is gone
    rev.innerHTML=`<div class="big">${escapeHtml(msg||"Couldn't log this read.")}</div>
      <div class="did">your read: <b style="color:#eaf2ec">${eqBand(gut)}</b> (${gut}%).</div>
      <button class="drill-next" onclick="dismissLiveDrill()">Got it ▸</button>`;
    return;
  }
  const exact=eq.hero_pct, exactBand=eq.band||eqBand(exact);
  const {cls, verdict, gutBand} = readVerdict(gut, exact, exactBand);   // SAME judgment as the review drill
  const vs=eq.vs||{};
  const who = vs.name ? `${escapeHtml(vs.name)}'s ~${vs.range_pct}% range` : "their modeled range";
  const field = (eq.heads_up===false && eq.pot_way) ? ` · ${eq.pot_way}-way, discount for the field` : "";
  const lean = DRILL_LEAN?` · your lean: <b style="color:#cfe6d8;font-size:13px;display:inline">${DRILL_LEAN}</b>`:"";
  rev.className="drill-reveal show "+cls;
  rev.innerHTML=`
    <div class="big">${verdict}</div>
    <div class="row">
      <span>the model<b style="color:var(--gold)">${exactBand}</b><span class="eqpct">~${exact}%</span></span>
      <span>your read<b style="color:#eaf2ec">${gutBand}</b><span class="eqpct">${gut}%</span></span></div>
    <div class="did">vs ${who}${field} — a read, not the cards${lean}</div>
    ${talk}<button class="drill-next" onclick="dismissLiveDrill()">Got it ▸</button>`;
}
function dismissLiveDrill(){
  const el=document.getElementById("drillpanel"); el.style.display="none"; el.innerHTML="";
  DRILL_DP=null; DRILL_LEAN=null;
}

// ---- ◆ range-collapse (hand6 disentangle): the SECOND read-skill, kept LEGIBLY DISTINCT ----
// The green ♠ live ding grades your gut vs her MODELED range (range-READING). This is a DIFFERENT
// skill: once the hand reaches the cards, MODELED vs the EXACT cards can swing the other way — you
// read the range right and her LINE still collapsed it to the nuts. The two can point OPPOSITE ways,
// so this is its own violet ◆ surface, shown ONLY between hands (never co-resident with the live
// ding, which would teach the wrong gut adjustment).
let COLLAPSE_KEY=null;    // the (session,hand) already reconciled — keyed on BOTH because hand_no COLLIDES
                         // across sessions (mirrors the backend (session_id, hand_no) join key)
function clearCollapse(){ const c=document.getElementById("collapsecard"); if(c){ c.classList.remove("show"); c.innerHTML=""; } }
// a read "collapsed" when the cards moved its equity a FELT amount — a band change OR a ≥12pt swing.
// band-only missed big SAME-band collapses (44→57, both "a coin flip") and fired on hairline crosses
// (41.6→42.4 = 0.8pt); magnitude-aware matches the live ding's own band+size discipline (readVerdict).
// Constants are play-gate tunable.
function collapsed(r){ const d=Math.abs(r.delta); return d>=12 || (r.modeled_band!==r.exact_band && d>=4); }
function syncCollapse(v){
  // ONLY between hands (!in_hand + over) on a running session — never while a hand (incl. showdown) is
  // live, so the card can't stack under a still-up live ding. In-hand / lobby clears it AND re-arms.
  if(v && !v.in_hand && v.over && v.session && v.session.id && v.hand_no!=null){ maybeCollapse(v.session.id, v.hand_no); }
  else { clearCollapse(); COLLAPSE_KEY=null; }
}
async function maybeCollapse(sid, hand){
  const key=sid+"\0"+hand;
  if(COLLAPSE_KEY===key) return;            // already fetching/shown/dismissed this (session,hand) — re-entrant-safe
  COLLAPSE_KEY=key;
  let reads=[];
  try{ const r=await api("/api/read_reconciliation?session="+encodeURIComponent(sid)); reads=(r&&r.reads)||[]; }
  catch(e){ COLLAPSE_KEY=null; return; }     // transient — the next render (a focus / action) retries this (session,hand)
  // still between hands on the SAME (session, hand)? hand_no ALONE collides across sessions, so a stale
  // fetch for session A hand N must NOT render under session B hand N — re-check the session id too (codex L3).
  if(!(LASTVIEW && !LASTVIEW.in_hand && LASTVIEW.over && LASTVIEW.hand_no===hand
       && LASTVIEW.session && LASTVIEW.session.id===sid)) return;
  // only THIS (session,hand)'s reads where the cards actually MOVED the equity (collapsed) — not a wobble
  const moved=reads.filter(r=>r.session_id===sid && r.hand_no===hand && collapsed(r));
  if(!moved.length){ clearCollapse(); return; }
  moved.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));   // surface the sharpest move
  const card=document.getElementById("collapsecard"); if(!card) return;
  card.innerHTML=collapseCardHtml(moved);
  card.classList.add("show");
}
function collapseCardHtml(moved){
  const m=moved[0];
  const against=m.delta<0;                          // exact WORSE than modeled → the cards came HARSHER
  const readGood=readVerdict(m.gut, m.modeled, m.modeled_band).cls==="good";   // band-right AND ≤10pt off
  const big=against
    ? (readGood ? "You read her range right — her line still collapsed it to the nuts. A collapse to smell, not a reading miss."
                : "Her line collapsed the range to a monster — the cards came even harsher than your read had it.")
    : (readGood ? "The range looked scarier than her actual hand — you read it right, she just didn't have it."
                : "The cards came kinder than the model — the range was bluffier than it looked, even past your read.");
  const dir=against?"▼ against you":"▲ in your favor";
  const verdict=`<span style="color:${readGood?'#7fe0a8':'#9c8a4e'}">${readGood?'✓':'~'} read</span>`
    +` · <span style="color:var(--collapse)">${dir}</span>`;
  return `
    <div class="collapse-hd"><span class="lbl">◆ range-collapse · ${escapeHtml(m.street||"")}</span>
      <span class="step">modeled vs the cards</span></div>
    <div class="collapse-big">${big}</div>
    <div class="collapse-row">
      <span>your read<b>${eqBand(m.gut)}</b><span class="eqpct">${m.gut}%</span></span>
      <span class="arrow">→</span>
      <span>the model<b>${m.modeled_band}</b><span class="eqpct">~${m.modeled}%</span></span>
      <span class="arrow">→</span>
      <span>the cards<b>${m.exact_band}</b><span class="eqpct">${m.exact}%</span></span>
    </div>
    <div class="collapse-did">${verdict} — two skills: the ♠ live check graded your <b>range-read</b>; this ◆ marks the <b>collapse</b> you couldn't see until the cards.</div>
    <button class="collapse-next" onclick="dismissCollapse()">Got it ◆</button>`;
}
// "Got it" = seen this (session,hand) → stays gone (COLLAPSE_KEY holds it; syncCollapse re-arms only when
// the view leaves the hand). Re-entrant-safe: a focus/visibility re-render hits the COLLAPSE_KEY guard.
function dismissCollapse(){ clearCollapse(); }

async function playFrames(frames, gen, handNo, dps){
  if(!frames.length) return;
  const live = ()=> gen===COACH_GEN && REVIEW_HAND===handNo;   // still the active review?
  // pause for the drill at the frame each hero decision precedes (only spots with a real equity)
  const drillable = (dps||[]).filter(d=>d.equity!=null);
  const byFrame = {};
  drillable.forEach((d,idx)=>{ d._dn=idx+1; (byFrame[d.frame_index]=byFrame[d.frame_index]||[]).push(d); });
  const total = drillable.length;
  const delay = SPEED==="instant" ? 0 : DELAY[SPEED];
  for(let i=0;i<frames.length;i++){
    if(!live()) return;                       // backed out / superseded — stop rendering behind it
    for(const dp of (byFrame[i]||[])){        // drill(s) that fire BEFORE this frame plays
      if(!live()) return;
      await runDrill(dp, dp._dn, total);      // table holds at the prior frame while the player estimates
      if(!live()) return;
    }
    renderTable(frames[i],true); flashAction(frames[i]);
    if(delay) await sleep(delay);
  }
}

async function restoreView(){ REVIEW_HAND=null; REVIEW_SID=null; REVIEW_SHOWN=false; hideCoach(); try{ render(await api("/api/state")); }catch(e){} }

renderSpeed();
loadSettings();
syncState();
</script>
